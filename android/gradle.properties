# Huge heap + metaspace can force swap on 8–16GB RAM laptops and make assembleDebug take 10–20+ minutes.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

# Slow campus Wi‑Fi / flaky links to dl.google.com — avoid Gradle giving up too early on big AGP jars (~15MB).
systemProp.http.connectionTimeout=300000
systemProp.http.socketTimeout=300000
android.useAndroidX=true
android.enableJetifier=true
